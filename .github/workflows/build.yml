name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Audio (ALSA), fonts, and the Wayland / X11 keyboard libraries GPUI links against
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # Artifacts don't keep the executable bit, so Unix binaries go into a tarball
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            asset=osu-kiai-${{ matrix.name }}.exe
            cp target/release/osu-kiai.exe "$asset"
          else
            asset=osu-kiai-${{ matrix.name }}.tar.gz
            tar -czf "$asset" -C target/release osu-kiai
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
