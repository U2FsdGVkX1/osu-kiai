[package]
name = "osu-music"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7"
gpui-kit = "0.7.3"
image = { version = "0.25", default-features = false }
rand = "0.9"
rayon = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "vorbis", "wav", "flac"] }
rosu-pp = "4"
rust-i18n = "4"
sys-locale = "0.3"

# Hiding the mouse pointer over the video, which GPUI has no API for
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor"] }
